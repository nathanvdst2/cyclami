# Déploie le service photos (Cloudflare Worker + stockage R2) à chaque modification.
# Nécessite le secret GitHub CLOUDFLARE_API_TOKEN ; BREVO_API_KEY (facultatif) active les e-mails.
name: Service photos Cloudflare

on:
  push:
    branches: [main]
    paths:
      - cloudflare/photos-worker/**
      - .github/workflows/cloudflare-photos.yml
  workflow_dispatch:

concurrency:
  group: cloudflare-photos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/photos-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Tester le service
        run: node test/worker.test.mjs

      - name: Vérifier et nettoyer le jeton Cloudflare
        id: secrets
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Un copier-coller peut ajouter des espaces ou une ligne en trop : on ne garde que
          # le jeton lui-même (un seul « mot » d au moins 30 caractères, hors adresse web).
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '"'"'" | tr -s '[:space:]' '\n' | grep -E '^[^/:[:space:]]{30,}$' | head -n1 || true)
          if [ -z "$TOKEN" ]; then
            if [ -z "$RAW_TOKEN" ]; then
              echo "::warning::Secret CLOUDFLARE_API_TOKEN absent : service photos non déployé (voir README)."
            else
              echo "::error::Le secret CLOUDFLARE_API_TOKEN ne contient pas de jeton valide. Recrée-le en ne collant que le jeton."
              exit 1
            fi
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TOKEN" != "$RAW_TOKEN" ]; then
            echo "::notice::Le secret contenait des espaces ou une ligne en trop : seul le jeton est utilisé."
          fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Créer le stockage R2 (première fois)
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: 63da44dc447effa065c40e6915633335
        run: |
          if npx --yes wrangler@4.141.0 r2 bucket list | grep -q 'cyclami-photos'; then
            echo "Stockage cyclami-photos déjà créé"
          else
            npx --yes wrangler@4.141.0 r2 bucket create cyclami-photos
          fi

      - name: Déployer le service
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: 63da44dc447effa065c40e6915633335
        run: npx --yes wrangler@4.141.0 deploy

      - name: Clé des notifications push (créée une seule fois)
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: 63da44dc447effa065c40e6915633335
        run: |
          if npx --yes wrangler@4.141.0 secret list --format json | grep -q '"VAPID_PRIVATE_JWK"'; then
            echo "Clé VAPID déjà en place"
          else
            node -e "crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign']).then(k=>crypto.subtle.exportKey('jwk',k.privateKey)).then(j=>process.stdout.write(JSON.stringify(j)))" \
              | npx --yes wrangler@4.141.0 secret put VAPID_PRIVATE_JWK
            echo "✅ Clé VAPID créée"
          fi

      - name: Configurer l'envoi d'e-mails (Brevo)
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: 63da44dc447effa065c40e6915633335
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SUPABASE_AUTH_HOOK_SECRET: ${{ secrets.SUPABASE_AUTH_HOOK_SECRET }}
        run: |
          # e-mails de connexion (crochet « Send Email » de Supabase), si le secret est fourni
          HOOK=$(printf '%s' "$SUPABASE_AUTH_HOOK_SECRET" | tr -d '[:space:]')
          if [ -n "$HOOK" ]; then
            echo "::add-mask::$HOOK"
            printf '%s' "$HOOK" | npx --yes wrangler@4.141.0 secret put AUTH_HOOK_SECRET
          fi
          KEY=$(printf '%s' "$BREVO_API_KEY" | tr -d '[:space:]')
          if [ -z "$KEY" ]; then
            echo "::warning::Secret BREVO_API_KEY absent : les e-mails de notification ne sont pas activés (voir README)."
            exit 0
          fi
          case "$KEY" in
            xkeysib-*) ;;
            xsmtpsib-*) echo "::error::BREVO_API_KEY est une clé SMTP : il faut une clé API (onglet « Clés API », commence par xkeysib-)."; exit 1 ;;
            *) echo "::warning::BREVO_API_KEY ne commence pas par xkeysib- : vérifie que c'est bien une clé API Brevo complète." ;;
          esac
          # clé partagée avec la base, dérivée de la clé Brevo (même calcul dans supabase-schema.yml)
          NOTIFY_SECRET=$(printf 'cyclami-notify:%s' "$KEY" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$KEY"
          echo "::add-mask::$NOTIFY_SECRET"
          printf '%s' "$KEY" | npx --yes wrangler@4.141.0 secret put BREVO_API_KEY
          printf '%s' "$NOTIFY_SECRET" | npx --yes wrangler@4.141.0 secret put NOTIFY_SECRET

      - name: DNS de réception des réponses (MX de reply.cyclami.com vers Brevo)
        if: steps.secrets.outputs.ok == 'true'
        continue-on-error: true
        run: |
          API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ZONE=$(curl -s -H "$AUTH" "$API/zones?name=cyclami.com" | grep -oE '"id":"[0-9a-f]{32}"' | head -n1 | cut -d'"' -f4)
          if [ -z "$ZONE" ]; then
            echo "::warning::Le jeton Cloudflare ne peut pas lire la zone cyclami.com : ajoute-lui la permission « Zone → DNS → Edit » (voir README), ou crée les MX à la main."
            exit 0
          fi
          # Des enregistrements NS sur reply.cyclami.com confieraient le sous-domaine à d'autres serveurs
          # et masqueraient les MX ci-dessous : on les retire.
          for ID in $(curl -s -H "$AUTH" "$API/zones/$ZONE/dns_records?type=NS&name=reply.cyclami.com" | grep -oE '"id":"[0-9a-f]{32}"' | cut -d'"' -f4); do
            if curl -s -X DELETE -H "$AUTH" "$API/zones/$ZONE/dns_records/$ID" | grep -q '"success":true'; then
              echo "🧹 Enregistrement NS de reply.cyclami.com supprimé ($ID)"
            else
              echo "::warning::Impossible de supprimer l'enregistrement NS $ID de reply.cyclami.com"
            fi
          done
          for PAIR in "inbound1.sendinblue.com:10" "inbound2.sendinblue.com:20"; do
            HOST=${PAIR%%:*}; PRIO=${PAIR##*:}
            if curl -s -H "$AUTH" "$API/zones/$ZONE/dns_records?type=MX&name=reply.cyclami.com" | grep -q "\"content\":\"$HOST\""; then
              echo "MX $HOST déjà en place"
              continue
            fi
            RES=$(curl -s -X POST -H "$AUTH" -H 'Content-Type: application/json' "$API/zones/$ZONE/dns_records" \
              -d "{\"type\":\"MX\",\"name\":\"reply.cyclami.com\",\"content\":\"$HOST\",\"priority\":$PRIO,\"ttl\":1}")
            if printf '%s' "$RES" | grep -q '"success":true'; then
              echo "✅ MX $HOST (priorité $PRIO) créé"
            else
              echo "::warning::Création du MX $HOST refusée : $(printf '%s' "$RES" | head -c 300)"
            fi
          done

      - name: Réception des réponses des refuges (Brevo « inbound »)
        if: steps.secrets.outputs.ok == 'true'
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          INBOUND_DOMAIN: reply.cyclami.com
          WORKER_URL: https://cyclami-photos.nathanbarbaraytb.workers.dev
        run: |
          KEY=$(printf '%s' "$BREVO_API_KEY" | tr -d '[:space:]')
          [ -z "$KEY" ] && { echo "Pas de clé Brevo : réception non configurée."; exit 0; }
          # même clé que le service (inboundKey) : sha256("cyclami-inbound:" + clé Brevo)
          IN_KEY=$(printf 'cyclami-inbound:%s' "$KEY" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$KEY"
          echo "::add-mask::$IN_KEY"
          HOOK_URL="$WORKER_URL/inbound?key=$IN_KEY"
          EXISTING=$(curl -s -H "api-key: $KEY" -H 'accept: application/json' 'https://api.brevo.com/v3/webhooks?type=inbound')
          if printf '%s' "$EXISTING" | grep -q "$IN_KEY"; then
            echo "Webhook de réception déjà en place pour $INBOUND_DOMAIN"
            exit 0
          fi
          RES=$(curl -s -w '\n%{http_code}' -X POST 'https://api.brevo.com/v3/webhooks' \
            -H "api-key: $KEY" -H 'content-type: application/json' -H 'accept: application/json' \
            -d "{\"type\":\"inbound\",\"events\":[\"inboundEmailProcessed\"],\"domain\":\"$INBOUND_DOMAIN\",\"url\":\"$HOOK_URL\",\"description\":\"Cyclami - réponses des refuges\"}")
          CODE=$(printf '%s' "$RES" | tail -n1)
          if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
            echo "✅ Webhook de réception créé pour $INBOUND_DOMAIN"
          else
            echo "::warning::Brevo a refusé la création du webhook de réception ($CODE) : $(printf '%s' "$RES" | head -n1 | sed "s/$IN_KEY/***/g")"
          fi
