# Vérifie chaque modification : les fonctions serveur (Netlify) passent leurs tests, le site
# se construit et toutes les pages s'affichent sans erreur (vrai navigateur, base simulée).
name: Vérification du site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tester les fonctions Netlify (e-mails, push, lieux)
        run: npm run test:functions
      - name: Aperçu des liens partagés
        run: node tests/share-preview.test.mjs
      # Projet Supabase fictif : le test ne contacte jamais la vraie base (tout est simulé)
      - name: Construire le site
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://cyclami-test.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
      - name: Installer Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Tester la photo de profil réservée
        run: node tests/reserved-avatar.test.mjs
      - name: Tester toutes les pages
        run: npm run test:smoke
        env:
          SHOTS_DIR: shots
      - name: Garder les captures d'écran en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: shots
