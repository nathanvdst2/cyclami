# Diagnostic de la réception des réponses des refuges (lancement manuel uniquement).
# Brevo (webhook et e-mails reçus) → service Cloudflare (/inbound) → base (discussions).
# Ne modifie rien ; les adresses e-mail sont masquées dans le journal.
name: Diagnostic réception refuges

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Brevo — webhook de réception et derniers e-mails reçus
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          KEY=$(printf '%s' "$BREVO_API_KEY" | tr -d '[:space:]')
          [ -n "$KEY" ] || { echo "::error::Secret BREVO_API_KEY absent"; exit 0; }
          IN_KEY=$(printf 'cyclami-inbound:%s' "$KEY" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$KEY"; echo "::add-mask::$IN_KEY"
          mask() { sed -E "s/$IN_KEY/***/g; s/[A-Za-z0-9._%+-]+@(gmail|hotmail|outlook|yahoo|icloud)[A-Za-z.]*/***@\1/g"; }
          echo '--- DNS : serveurs de messagerie (MX) de reply.cyclami.com et cyclami.com'
          for D in reply.cyclami.com cyclami.com; do
            echo "$D (Google) :"; curl -s "https://dns.google/resolve?name=$D&type=MX"; echo
            echo "$D (Cloudflare) :"; curl -s -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$D&type=MX"; echo
          done
          if [ -n "$CF_TOKEN" ]; then
            ZONE=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=cyclami.com" | grep -oE '"id":"[0-9a-f]{32}"' | head -n1 | cut -d'"' -f4)
            echo '--- Enregistrements NS de reply vus par l’API Cloudflare (il ne doit y en avoir aucun)'
            curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?type=NS&name=reply.cyclami.com" \
              | grep -oE '"(name|content)":"[^"]*"' | paste -sd' ' - || true
            echo '--- Enregistrements MX vus par l’API Cloudflare'
            curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?type=MX" \
              | grep -oE '"(name|content|priority|proxied)":("[^"]*"|[0-9a-z]+)' | paste -sd' ' -
          fi
          echo '--- Webhooks de réception'
          curl -s -H "api-key: $KEY" -H 'accept: application/json' 'https://api.brevo.com/v3/webhooks?type=inbound' | mask
          echo; echo '--- Derniers e-mails reçus par Brevo'
          EVENTS=$(curl -s -H "api-key: $KEY" -H 'accept: application/json' "https://api.brevo.com/v3/inbound/events?limit=10&sort=desc&startDate=$(date -u -d '-3 days' +%F)&endDate=$(date -u +%F)")
          printf '%s\n' "$EVENTS" | mask
          for U in $(printf '%s' "$EVENTS" | grep -oE '"uuid":"[^"]+"' | cut -d'"' -f4 | head -5); do
            echo; echo "--- Détail $U"
            curl -s -H "api-key: $KEY" -H 'accept: application/json' "https://api.brevo.com/v3/inbound/events/$U" | mask | head -c 3000
          done
          echo; echo '--- Test du service Cloudflare (message vide : rien n’est enregistré)'
          curl -sS -X POST "https://cyclami-photos.nathanbarbaraytb.workers.dev/inbound?key=$IN_KEY" \
            -H 'Content-Type: application/json' -d '{"items":[]}' -w '\nHTTP %{http_code}\n' | mask

      - name: Base — réglage et discussions
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          eval "$(python3 - <<'PY'
          import os, shlex
          from urllib.parse import unquote
          url = os.environ["SUPABASE_DB_URL"].strip()
          for prefix in ("postgresql://", "postgres://"):
              if url.startswith(prefix):
                  url = url[len(prefix):]
                  break
          creds, _, rest = url.rpartition("@")
          user, _, password = creds.partition(":")
          if password.startswith("[") and password.endswith("]"):
              password = password[1:-1]
          hostport, _, db = rest.partition("/")
          host, _, port = hostport.partition(":")
          print("echo ::add-mask::" + shlex.quote(password))
          for k, v in {"PGUSER": unquote(user), "PGPASSWORD": password, "PGHOST": host,
                       "PGPORT": port or "5432", "PGDATABASE": db.split("?")[0] or "postgres",
                       "PGSSLMODE": "require"}.items():
              print(f"export {k}={shlex.quote(v)}")
          PY
          )"
          export PGCONNECT_TIMEOUT=20
          psql -X -P pager=off <<'SQL'
          \echo '--- Domaine de réception activé'
          select value from private.settings where key = 'inbound_domain';
          \echo '--- Fonction de réception présente'
          select proname from pg_proc where proname in ('receive_shelter_email', 'admin_shelter_threads');
          \echo '--- Dernières propositions (adresse masquée)'
          select created_at, is_test, '***@' || split_part(email, '@', 2) as dest, left(reply_token, 6) as jeton
          from private.shelter_invites order by created_at desc limit 5;
          \echo '--- Derniers messages des discussions'
          select created_at, direction, '***@' || split_part(email, '@', 2) as refuge, left(body, 40) as debut
          from private.shelter_messages order by created_at desc limit 8;
          SQL
