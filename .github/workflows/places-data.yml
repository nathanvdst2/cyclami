# Remplit le stockage des lieux utiles (Belgique et France) depuis OpenStreetMap : chaque jour un lot de carreaux, chaque carreau rafraîchi tous les 6 jours.
name: Lieux Belgique et France

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      regions:
        description: "Régions à importer (belgique, france ; vide = toutes)"
        default: ""

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Télécharger et importer les lieux
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          KEY=$(printf '%s' "$BREVO_API_KEY" | tr -d '[:space:]')
          [ -n "$KEY" ] || { echo "::error::Secret BREVO_API_KEY absent (sert à dériver la clé partagée)"; exit 1; }
          export NOTIFY_SECRET=$(printf 'cyclami-notify:%s' "$KEY" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$NOTIFY_SECRET"
          node scripts/import-places.mjs ${{ inputs.regions }}
