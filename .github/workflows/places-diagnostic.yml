# Diagnostic des lieux sur la carte (lancement manuel) : interroge le service Cyclami et les serveurs OpenStreetMap.
name: Diagnostic lieux

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Service Cyclami (Waterloo)
        run: |
          echo "--- Carreaux déjà importés (date)"
          curl -sS -m 30 'https://cyclami-photos.nathanbarbaraytb.workers.dev/places/tiles' | python3 -c "import json,sys,datetime; d=json.load(sys.stdin); print(len(d), 'carreaux'); [print(k, datetime.datetime.fromtimestamp(v/1000).isoformat()) for k,v in sorted(d.items())]" || true
          curl -sS -m 60 -o /tmp/p.json -w 'HTTP %{http_code} en %{time_total}s\n' 'https://cyclami-photos.nathanbarbaraytb.workers.dev/places?lat=50.72&lng=4.40' || true
          head -c 400 /tmp/p.json; echo
          echo "--- 2e appel (doit venir du cache)"
          curl -sS -m 60 -o /dev/null -w 'HTTP %{http_code} en %{time_total}s\n' 'https://cyclami-photos.nathanbarbaraytb.workers.dev/places?lat=50.72&lng=4.40' || true
      - name: Serveurs OpenStreetMap en direct
        run: |
          Q='[out:json][timeout:25];(nwr["leisure"="dog_park"](around:4500,50.72,4.40););out center 5;'
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            echo "--- $u"
            curl -sS -m 40 -o /tmp/o.json -w 'HTTP %{http_code} en %{time_total}s\n' --data-urlencode "data=$Q" "$u" || true
            head -c 200 /tmp/o.json; echo
          done
